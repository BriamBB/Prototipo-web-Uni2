<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni2 – Prototipo de la comunidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--beige:#f7f6e5;--turquesa:#77d2dc;--morado:#6c4ab6;--rojo:#973e3e;--naranja:#fe786b;--papel:#fffdf0;--crema:#feecb5;
--display:"Caprasimo",Georgia,serif;--texto:"Plus Jakarta Sans",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--beige);color:#000;font:500 1rem/1.55 var(--texto)}
img{max-width:100%;height:auto}
:focus-visible{outline:3px solid var(--morado);outline-offset:3px}
.wrap{width:min(1060px,100% - 2rem);margin-inline:auto}
.cinta{height:18px;background:repeating-conic-gradient(var(--morado) 0 25%,var(--beige) 0 50%) 0 0/18px 18px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem)}h2{font-size:clamp(1.6rem,3.5vw,2.2rem)}h3{font-size:1.2rem}
p{margin:0 0 .9em}.peq{font-size:.9rem}
.ventana{background:var(--papel);border:2px solid #000;box-shadow:6px 6px 0 #000}
.barra{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.35rem .8rem;border-bottom:2px solid #000;font-weight:800;font-size:.9rem}
.cuerpo{padding:1rem 1.1rem 1.2rem}
.c-t>.barra{background:var(--turquesa)}.c-n>.barra{background:var(--naranja)}.c-m>.barra{background:var(--morado);color:#fff}.c-r>.barra{background:var(--rojo);color:#fff}.c-b>.barra{background:var(--crema)}
.btn{display:inline-block;background:var(--naranja);color:#000;font:800 .95rem var(--texto);text-decoration:none;padding:.6rem 1.1rem;border:2px solid #000;box-shadow:3px 3px 0 #000;cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.sec{background:var(--papel)}.btn.ok{background:var(--turquesa)}.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn.xs{padding:.35rem .7rem;font-size:.85rem}
label{display:block;font-weight:800;margin:.9rem 0 .25rem}
input,textarea{width:100%;font:500 1rem var(--texto);padding:.6rem .7rem;border:2px solid #000;background:#fff;border-radius:0}
.pw{position:relative}.pw input{padding-right:3.7rem}
.ojo{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:34px;display:grid;place-items:center;padding:0;background:var(--turquesa);border:2px solid #000;box-shadow:2px 2px 0 #000;cursor:pointer}
.ojo[aria-pressed=true]{background:var(--naranja)}.ojo:active{box-shadow:none}
.sel{position:relative}.barra-f .sel{min-width:240px}
.nat{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.sel-b{width:100%;text-align:left;font:600 1rem var(--texto);color:#000;background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:.6rem 2.6rem .6rem .7rem;cursor:pointer;position:relative;border-radius:0}
.sel-b::after{content:"";position:absolute;right:.8rem;top:50%;margin-top:-4px;border:6px solid transparent;border-top:8px solid var(--morado);border-bottom:0}
.sel-b[aria-expanded=true]{background:var(--turquesa)}.sel-b[aria-expanded=true]::after{border-top:0;border-bottom:8px solid var(--morado)}
.sel-l{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);margin:0;padding:0;list-style:none;max-height:240px;overflow:auto;background:var(--papel);border:2px solid #000;box-shadow:5px 5px 0 #000}
.sel-l li{padding:.55rem .8rem;font-weight:600;cursor:pointer;border-bottom:1px solid #000}.sel-l li:last-child{border-bottom:0}
.sel-l li:hover,.sel-l li:focus{background:var(--turquesa);outline:0}
.sel-l li:focus-visible{outline:3px solid var(--morado);outline-offset:-3px}
.sel-l li[aria-selected=true]{background:var(--morado);color:#fff}.sel-l li[aria-selected=true]::before{content:"✦ "}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--rojo);background:#fff3f1}
.err{color:var(--rojo);font-weight:700;font-size:.9rem;margin:.3rem 0 0;min-height:0}
.aviso{border:2px dashed #000;background:var(--crema);padding:.6rem .8rem;font-size:.9rem;margin:0 0 1rem}
.sello{display:inline-block;background:var(--crema);border:2px solid #000;padding:.05rem .5rem;font-size:.78rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:0;padding:0;list-style:none}
.chip{border:2px solid #000;background:var(--turquesa);padding:.05rem .6rem;font-size:.85rem;font-weight:700}
.chip:nth-child(even){background:var(--naranja)}
button.chip{font-family:var(--texto);color:#000;cursor:pointer;background:var(--papel);font-size:.9rem;padding:.25rem .8rem}
button.chip[aria-pressed=true]{background:var(--morado);color:#fff}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:2rem 0}
.auth .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:2.5rem;align-items:center;max-width:900px}
.auth img{width:min(100%,260px);justify-self:center}
.pestanas{display:flex;gap:.5rem;margin-bottom:.5rem}
.cred{font-size:.9rem}.cred code{background:#fff;border:1px solid #000;padding:0 .3rem;font-weight:700}
.codigo{letter-spacing:.4em;font-weight:800;font-size:1.3rem;text-align:center}
/* app */
.top{background:var(--papel);border-bottom:2px solid #000}
.top .wrap{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.6rem 0;flex-wrap:wrap}
.top img{width:46px;display:block}
.nav{display:flex;gap:.4rem;flex-wrap:wrap}
.nav a{font-weight:800;text-decoration:none;color:#000;padding:.4rem .8rem;border:2px solid transparent}
.nav a:hover{border-color:#000}.nav a[aria-current=page]{background:var(--morado);color:#fff;border-color:#000}
.yo{display:flex;gap:.6rem;align-items:center;font-size:.9rem;font-weight:700}
main{padding:2rem 0 4rem;min-height:70vh}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.6rem}
.accesos{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin:1.5rem 0 2.5rem}
.acc{display:block;text-decoration:none;color:#000}.acc:hover .ventana{transform:translate(3px,3px);box-shadow:3px 3px 0 #000}
.acc .ventana{transition:transform .1s,box-shadow .1s;height:100%}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.fila{display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:2px solid #000}
.fila:last-child{border-bottom:0}
.ava{flex:none;width:44px;height:44px;border:2px solid #000;display:grid;place-items:center;font:400 1.2rem var(--display)}
.barra-f{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:1rem 0 1.5rem}
.barra-f select{width:auto}
.post{display:block;width:100%;text-align:left;font:inherit;color:#000;background:var(--papel);border:2px solid #000;box-shadow:4px 4px 0 #000;padding:.9rem 1rem;margin-bottom:1.1rem;cursor:pointer}
.post:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.post h3{margin:.3rem 0}
dialog{padding:0;width:min(640px,100% - 1.5rem);max-height:90vh;overflow:auto;color:#000}
dialog::backdrop{background:rgba(0,0,0,.55)}
#aviso{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:20;max-width:92vw}
#aviso div{background:#000;color:#fff;padding:.6rem 1.1rem;font-weight:700;border:2px solid #fff}
.com{border-left:6px solid var(--naranja);padding-left:.8rem;margin:.8rem 0}
footer{border-top:2px solid #000;padding:1rem 0 2rem;font-size:.85rem}
@media(max-width:820px){.auth .wrap,.dos{grid-template-columns:1fr}.auth img{width:150px;justify-self:start}.accesos{grid-template-columns:1fr 1fr}.yo span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const OJO_A='<svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><path d="M2 14C6 6 22 6 26 14C22 22 6 22 2 14Z" fill="#fffdf0" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/><circle cx="14" cy="14" r="5.5" fill="#000"/><path d="M14 9.5l1.3 3.2 3.2 1.3-3.2 1.3L14 18.5l-1.3-3.2L9.5 14l3.2-1.3z" fill="#77d2dc"/></svg>';
const OJO_C='<svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><path d="M2 13C6 21 22 21 26 13" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/><path d="M6.5 17.5L4.5 21M14 19.5v4M21.5 17.5l2 3.5" stroke="#000" stroke-width="2.5" stroke-linecap="round"/><path d="M14 5l1.1 2.9L18 9l-2.9 1.1L14 13l-1.1-2.9L10 9l2.9-1.1z" fill="#000"/></svg>';
function cierraSel(){document.querySelectorAll('.sel-l:not([hidden])').forEach(l=>{l.hidden=true;l.previousElementSibling.setAttribute('aria-expanded','false')})}
document.addEventListener('click',e=>{if(!e.target.closest('.sel'))cierraSel()});
function mejora(raiz){(raiz||document).querySelectorAll('select:not([data-ok])').forEach(s=>{
 s.dataset.ok=1;s.className='nat';s.tabIndex=-1;s.setAttribute('aria-hidden','true');
 const w=document.createElement('div'),b=document.createElement('button'),l=document.createElement('ul'),lab=s.labels[0];
 w.className='sel';s.before(w);w.append(s,b,l);
 b.type='button';b.id=s.id+'-b';b.className='sel-b';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
 if(lab){lab.id=s.id+'-l';lab.htmlFor=b.id;b.setAttribute('aria-labelledby',lab.id+' '+b.id);l.setAttribute('aria-labelledby',lab.id)}
 l.className='sel-l';l.hidden=true;l.setAttribute('role','listbox');
 const ops=[...s.options].map((o,i)=>{const li=document.createElement('li');li.setAttribute('role','option');li.tabIndex=-1;li.textContent=o.text;li.dataset.i=i;l.append(li);return li});
 const pinta=()=>{b.textContent=s.options[s.selectedIndex].text;ops.forEach((li,i)=>li.setAttribute('aria-selected',i===s.selectedIndex))};
 const abre=()=>{cierraSel();l.hidden=false;b.setAttribute('aria-expanded','true');ops[s.selectedIndex].focus()};
 const elige=i=>{s.selectedIndex=i;pinta();cierraSel();b.focus();s.dispatchEvent(new Event('change',{bubbles:true}))};
 pinta();
 b.onclick=()=>l.hidden?abre():cierraSel();
 b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();abre()}};
 l.onclick=e=>{const li=e.target.closest('li');if(li)elige(+li.dataset.i)};
 l.onkeydown=e=>{const i=ops.indexOf(document.activeElement),k=e.key;
  if(k==='ArrowDown'){e.preventDefault();ops[Math.min(i+1,ops.length-1)].focus()}
  else if(k==='ArrowUp'){e.preventDefault();ops[Math.max(i-1,0)].focus()}
  else if(k==='Home'){e.preventDefault();ops[0].focus()}
  else if(k==='End'){e.preventDefault();ops[ops.length-1].focus()}
  else if(k==='Enter'||k===' '){e.preventDefault();elige(i)}
  else if(k==='Escape'){e.preventDefault();e.stopPropagation();cierraSel();b.focus()}
  else if(k==='Tab')cierraSel()};
})}
function logoImg(w){return `<img src="${LOGO}" width="${w}" alt="Uni2, comunidad universitaria">`}
function campo(id,lab,tipo,extra){const i=`<input id="${id}" name="${id}" type="${tipo||'text'}" aria-describedby="${id}-e" ${extra||''}>`;
 const c=tipo==='password'?`<div class="pw">${i}<button type="button" class="ojo" data-act="ojo" data-for="${id}" aria-pressed="false" aria-label="Mostrar contraseña">${OJO_A}</button></div>`:i;
 return `<label for="${id}">${lab}</label>${c}<p class="err" id="${id}-e" role="alert"></p>`}
function setErr(f,id,msg){const i=f.querySelector('#'+id),e=f.querySelector('#'+id+'-e');if(i)i.setAttribute('aria-invalid','true');if(e)e.textContent=msg;return false}
function clr(f){f.querySelectorAll('[aria-invalid]').forEach(i=>i.removeAttribute('aria-invalid'));f.querySelectorAll('.err').forEach(e=>e.textContent='')}

 else h=`<div class="aviso cred"><b>Cuenta de prueba:</b><br>Correo <code>${DEMO.correo}</code><br>Contraseña <code>${DEMO.clave}</code> <button class="btn xs ok" type="button" data-act="rellenar">Rellenar</button></div>

  ${h}</div></div></div></div>`}

  <p style="margin:1rem 0 0"><a href="#eventos">Ver todos los eventos</a></p></div></div></section></div>`},
 conectar(){const cs=['Todas',...new Set(S.gente.map(p=>p.c))];const l=S.gente.filter(p=>filtroC==='Todas'||p.c===filtroC);

  <div class="grid">${l.map(tarjetaGente).join('')}</div>`},
 mentorias(){return `<h1>Mentorías</h1><p>Ofertas y solicitudes de ayuda académica entre estudiantes (datos de demostración).</p>
  <div class="grid">${S.men_l.map((m,i)=>{const on=S.men[m.id];return `<article class="ventana ${m.t==='Ofrece'?'c-t':'c-n'}"><div class="barra"><span>${m.t==='Ofrece'?'Ofrece ayuda':'Busca ayuda'}</span><span>${esc(m.p)}</span></div><div class="cuerpo">
  <h3>${esc(m.m)}</h3><p class="peq">${esc(m.p)} · ${m.s}.º semestre</p>
  <button class="btn xs sec" data-act="mend" data-id="${m.id}">Ver detalle</button> ${on?'<span class="sello">Solicitud enviada</span>':''}</div></article>`}).join('')}</div>`},
 eventos(){return `<h1>Eventos</h1><p>Planes de demostración para la comunidad. Inscríbete para guardar tu cupo simulado.</p>
  <div class="grid">${S.ev_l.map((e,i)=>`<article class="ventana ${['c-m','c-t','c-n','c-r','c-b'][i%5]}"><div class="barra"><span>${esc(e.f)}</span></div><div class="cuerpo"><h3>${esc(e.t)}</h3><p class="peq">${esc(e.l)}</p>

function render(){
 const app=$('#app');
 if(!user()){app.innerHTML=authView();mejora();document.title='Uni2 – Ingresar';return}
 let sec=(location.hash||'#inicio').slice(1);if(!V[sec])sec='inicio';
 app.innerHTML=shell(V[sec](),sec);mejora();document.title='Uni2 – '+SECS.find(s=>s[0]===sec)[1];
}
function dlg(t,body,cls){const d=$('#dlg');d.innerHTML=`<div class="barra ${cls||''}" style="background:var(--crema)"><span id="dlgt">${t}</span><button class="btn xs sec" data-act="cerrar" aria-label="Cerrar">Cerrar ✕</button></div><div class="cuerpo">${body}</div>`;mejora(d);if(!d.open)d.showModal()}
function verPost(id){const p=S.posts.find(x=>x.id==id),on=S.likes[id];
 dlg(esc(p.c),`<h2>${esc(p.t)}</h2><p class="peq">Por ${esc(p.a)}</p><p>${esc(p.x)}</p>
 <button class="btn xs ${on?'ok':''}" data-act="like" data-id="${id}" aria-pressed="${!!on}">${on?'Te gusta ✓':'Me gusta'} · ${p.l+(on?1:0)}</button>
 <h3 style="margin-top:1.4rem">Comentarios (${p.cm.length})</h3>${p.cm.map(c=>`<div class="com"><b>${esc(c.a)}</b><br>${esc(c.x)}</div>`).join('')||'<p class="peq">Aún no hay comentarios.</p>'}
 <form data-f="com" data-id="${id}" novalidate><label for="ct">Tu comentario</label><textarea id="ct" rows="3" aria-describedby="ct-e"></textarea><p class="err" id="ct-e" role="alert"></p><button class="btn xs" type="submit">Comentar</button></form>`)}
function verMen(id){const m=S.men_l.find(x=>x.id==id),on=S.men[id];
 dlg(esc(m.m),`<span class="sello">Datos de demostración</span><p class="peq" style="margin-top:.6rem">${m.t==='Ofrece'?'Ofrece ayuda':'Busca ayuda'} · ${esc(m.p)} · ${m.s}.º semestre</p><p>${esc(m.d)}</p><p><b>Horario:</b> ${esc(m.h)}</p>
 <button class="btn ${on?'ok':''}" data-act="men" data-id="${id}" ${on?'disabled':''}>${on?'Solicitud enviada ✓':(m.t==='Ofrece'?'Solicitar mentoría':'Ofrecer ayuda')}</button>`)}
function verEv(id){const e=S.ev_l.find(x=>x.id==id),on=S.ev[id];
 dlg(esc(e.t),`<span class="sello">Datos de demostración</span><p style="margin-top:.6rem"><b>Cuándo:</b> ${esc(e.f)}<br><b>Dónde:</b> ${esc(e.l)}</p><p>${esc(e.d)}</p>
 <button class="btn ${on?'ok':''}" data-act="ev" data-id="${id}" data-d="1" aria-pressed="${!!on}">${on?'Inscrito ✓ (cancelar)':'Inscribirme'}</button>`)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
 if(a==='ojo'){const i=$('#'+b.dataset.for),ver=i.type==='password';i.type=ver?'text':'password';b.setAttribute('aria-pressed',ver);b.setAttribute('aria-label',ver?'Ocultar contraseña':'Mostrar contraseña');b.innerHTML=ver?OJO_C:OJO_A}
 else if(a==='modo'){modo=b.dataset.m;render()}
 else if(a==='rellenar'){$('#cor').value=DEMO.correo;$('#cla').value=DEMO.clave}
 else if(a==='salir'){S.sesion=null;save();modo='login';location.hash='';render();say('Sesión cerrada')}
 else if(a==='con'){S.con[id]=!S.con[id];save();render();say(S.con[id]?'Interés enviado (simulado)':'Interés retirado')}
 else if(a==='evd')verEv(id);
 else if(a==='mend')verMen(id);
 else if(a==='men'){S.men[id]=1;save();verMen(id);render();say('Solicitud enviada (simulada)')}
 else if(a==='ev'){S.ev[id]=!S.ev[id];save();render();if(b.dataset.d)verEv(id);say(S.ev[id]?'Inscripción simulada guardada':'Inscripción cancelada')}
 else if(a==='fil'){filtroF=b.dataset.c;render()}
 else if(a==='post')verPost(id);
 else if(a==='like'){S.likes[id]=!S.likes[id];save();verPost(id);render()}
 else if(a==='cerrar')$('#dlg').close();
 else if(a==='nuevo')dlg('Nueva publicación',`<form data-f="nuevo" novalidate>${campo('pt','Título','text','maxlength="90"')}<label for="pc">Categoría</label><select id="pc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>${campo('px','Mensaje','text','')}<button class="btn" type="submit">Publicar</button></form>`);
});
document.addEventListener('change',e=>{if(e.target.dataset.sel==='c'){filtroC=e.target.value;render();$('#fc-b').focus()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f;clr(f);const v=id=>f.querySelector('#'+id)?.value.trim();
 if(k==='login'){let ok=true;if(!v('cor'))ok=setErr(f,'cor','Escribe tu correo institucional.');else if(!emailOk(v('cor')))ok=setErr(f,'cor','El correo debe terminar en @'+DOM+'.');
  if(!v('cla'))ok=setErr(f,'cla','Escribe tu contraseña.');if(!ok)return;
  const c=v('cor').toLowerCase(),u=c===DEMO.correo?DEMO:S.users.find(x=>x.correo===c);
  if(!u||u.clave!==f.querySelector('#cla').value)return setErr(f,'cla','Correo o contraseña incorrectos. Prueba con la cuenta de demostración.');
  S.sesion={nombre:u.nombre,correo:u.correo};save();location.hash='#inicio';render();say('Bienvenida/o a Uni2 (sesión simulada)')}
 else if(k==='registro'){let ok=true;if(!v('nom'))ok=setErr(f,'nom','Escribe tu nombre.');
  if(!v('cor'))ok=setErr(f,'cor','Escribe tu correo institucional.');else if(!emailOk(v('cor')))ok=setErr(f,'cor','El correo debe terminar en @'+DOM+'.');
  else if(v('cor').toLowerCase()===DEMO.correo||S.users.some(x=>x.correo===v('cor').toLowerCase()))ok=setErr(f,'cor','Ese correo ya tiene una cuenta de prueba.');
  if(f.querySelector('#cla').value.length<8)ok=setErr(f,'cla','Usa al menos 8 caracteres.');
  if(!f.querySelector('#may').checked){f.querySelector('#may-e').textContent='Uni2 es solo para mayores de 18 años.';ok=false}
  if(!ok)return;pend={nombre:v('nom'),correo:v('cor').toLowerCase(),clave:f.querySelector('#cla').value,carrera:v('car'),sem:v('sem')};modo='verif';render()}
 else if(k==='verif'){if(v('cod')!==CODIGO)return setErr(f,'cod','Código incorrecto. En esta demostración es '+CODIGO+'.');
  S.users.push(pend);S.sesion={nombre:pend.nombre,correo:pend.correo};save();pend=null;modo='login';location.hash='#inicio';render();say('Cuenta de demostración creada')}
 else if(k==='com'){const t=v('ct');if(!t)return setErr(f,'ct','Escribe algo antes de comentar.');
  S.posts.find(p=>p.id==f.dataset.id).cm.push({a:user().nombre,x:t});save();verPost(f.dataset.id);render();say('Comentario agregado')}
 else if(k==='nuevo'){let ok=true;if(!v('pt'))ok=setErr(f,'pt','Escribe un título.');if(!v('px'))ok=setErr(f,'px','Escribe tu mensaje.');if(!ok)return;
  const id=Math.max(...S.posts.map(p=>p.id))+1;S.posts.unshift({id,c:v('pc'),t:v('pt'),a:user().nombre,x:v('px'),l:0,cm:[]});save();$('#dlg').close();filtroF='Todas';render();say('Publicación creada')}
});
addEventListener('hashchange',()=>{$('#dlg').open&&$('#dlg').close();render();window.scrollTo(0,0)});
render();
</script>
